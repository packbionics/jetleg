# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    jetleg_leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

jetleg_leg_controller:
  ros__parameters:
    joints:
      - knee_joint_
      - ankle_joint_
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity