pointcloud_proc:

  x_min:
    type: double
    default_value: -1.0
  x_max:
    type: double
    default_value: 1.0
  y_min:
    type: double
    default_value: 0.0
  y_max:
    type: double
    default_value: 1.0

  # Controls how fine-grained the resolution of the output images are
  resolution:
    type: double
    default_value: 80